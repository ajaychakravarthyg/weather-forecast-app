# Render Blueprint — deploys the FastAPI backend on Render's free tier.
#
# You can either use this file (Render dashboard -> New -> Blueprint, point it at
# this repo) or configure the same values by hand as a new Web Service.
# See README.md -> Deployment for the click-by-click version.
services:
  - type: web
    name: weather-dashboard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT — binding to it is required or the deploy is marked unhealthy.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Set this to your Vercel URL after the frontend is deployed, e.g.
      # https://weather-forecast-app.vercel.app  (comma-separated for several).
      # Any *.vercel.app origin is already allowed by ALLOWED_ORIGIN_REGEX.
      - key: ALLOWED_ORIGINS
        sync: false
