name: CI

# Build once, scan what was built, publish only what passed.
#
#   build-frontend ─┐
#                   ├─► image (build → scan for CVEs → push if clean)
#   check-backend  ─┘
#   audit-deps ─────── independent, runs alongside
#
# The frontend bundle is built in its own job and handed to the image build as an
# artifact. The image that gets scanned is the exact image that gets pushed — it
# is tagged and pushed from the local daemon rather than rebuilt, so the bytes
# that were checked are the bytes that ship.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Weekly, so a CVE disclosed against an unchanged image still surfaces.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  # Pinned: an unpinned scanner makes builds fail on someone else's release day.
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  SEVERITY: CRITICAL,HIGH

jobs:
  # ==========================================================================
  # 1. Build the React bundle, publish it as an artifact.
  # ==========================================================================
  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` over `npm install`: installs the lockfile exactly, and fails if
      # package.json and the lock have drifted apart.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Report bundle size
        working-directory: frontend
        run: |
          {
            echo "### Frontend bundle"
            echo '```'
            du -sh dist
            ls -lh dist/assets | awk 'NR>1 {print $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # 2. Cheap backend sanity check — an image whose app cannot import is worse
  #    than a ten-second check here.
  # ==========================================================================
  check-backend:
    name: Check backend imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Import the app and assert its routes
        working-directory: backend
        run: |
          python - <<'PY'
          from app.main import app
          routes = sorted(r.path for r in app.routes if r.path.startswith('/api'))
          expected = {'/api/geocode', '/api/health', '/api/insights',
                      '/api/weather', '/api/weather/coords'}
          missing = expected - set(routes)
          assert not missing, f"routes missing: {missing}"
          print("routes:", ", ".join(routes))
          PY

  # ==========================================================================
  # 3. Dependency-level CVEs. Image scanning covers what is installed in the
  #    image; this covers the declared dependency trees, including dev-only
  #    packages that never reach an image but do reach a developer's machine.
  # ==========================================================================
  audit-deps:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (production tree)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          # Runtime dependencies gate the build; dev-only findings are reported
          # but do not, since they never reach a shipped artifact.
          npm audit --omit=dev --audit-level=high
          echo "--- dev tree (advisory only) ---"
          npm audit --audit-level=critical || true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Audits the *installed* environment rather than the requirements file:
      # --requirement resolves into a throwaway venv and would only see the
      # pinned lines, missing transitive packages — which is precisely where the
      # starlette CVEs that prompted this lived.
      - name: pip-audit
        working-directory: backend
        run: |
          pip install -r requirements.txt pip-audit
          pip-audit --strict --desc

  # ==========================================================================
  # 4. Build each image, scan it, and push only if it is clean.
  # ==========================================================================
  image:
    name: "Image: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: [build-frontend, check-backend]
    permissions:
      contents: read
      packages: write
      # Required to publish scan results to the repository's Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            target: prebuilt
          - name: backend
            context: ./backend
            target: prod
    steps:
      - uses: actions/checkout@v4

      # Only the frontend needs the bundle; the `prebuilt` target copies it
      # straight into nginx instead of running npm a second time.
      - name: Download frontend bundle
        if: matrix.name == 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: docker/setup-buildx-action@v3

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      # Built into the local daemon, NOT pushed. Nothing is published before the
      # scan has passed.
      - name: Build image (load locally, do not push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: local/${{ matrix.name }}:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache the Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # ---------------------------------------------------------------- scan --
      - name: Scan for CVEs (human-readable)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity "$SEVERITY" \
              --ignore-unfixed \
              --exit-code 0 \
              --format table \
              "local/${{ matrix.name }}:candidate" | tee scan.txt
          {
            echo "### ${{ matrix.name }} image — CVE scan"
            echo '```'
            tail -n 60 scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results to the Security tab
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/out" \
            "$TRIVY_IMAGE" image \
              --scanners vuln --severity "$SEVERITY" --ignore-unfixed \
              --exit-code 0 --format sarif --output "/out/trivy-${{ matrix.name }}.sarif" \
              "local/${{ matrix.name }}:candidate"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/out" \
            "$TRIVY_IMAGE" image \
              --format cyclonedx --output "/out/sbom-${{ matrix.name }}.json" \
              "local/${{ matrix.name }}:candidate"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.json
          retention-days: 30

      # The gate. Runs last of the scan steps so the report above is always
      # published even when this fails.
      - name: Fail on fixable CRITICAL/HIGH CVEs
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity "$SEVERITY" \
              --ignore-unfixed \
              --exit-code 1 \
              --quiet \
              "local/${{ matrix.name }}:candidate"
          echo "No fixable ${SEVERITY} vulnerabilities."

      # ---------------------------------------------------------------- push --
      # Reached only if the gate passed. Pushes the scanned image itself.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push the scanned image
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "pushing $tag"
            docker tag "local/${{ matrix.name }}:candidate" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
